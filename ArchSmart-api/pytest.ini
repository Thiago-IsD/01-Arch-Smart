[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
# Silencia so as ~102 deprecacoes pre-existentes conhecidas (declarative_base()
# e datetime.utcnow(), ambas de codigo legado, nao da suite nova). Cada filtro
# casa categoria E mensagem especificas de proposito — nunca
# "ignore::DeprecationWarning" global — para que uma deprecacao nova e real
# continue aparecendo no `pytest -q` em vez de se esconder atras destas.
filterwarnings =
    ignore:The ``declarative_base\(\)`` function is now available as sqlalchemy\.orm\.declarative_base\(\)\.:sqlalchemy.exc.MovedIn20Warning
    ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning
# app/tests/ nao entra aqui: aquela suite usa MagicMock como sessao de banco e
# afirma o formato da cadeia de chamadas, nao o comportamento — entao ela quebra
# a cada mudanca de query mesmo quando nada regride, e nao detecta vazamento
# entre contas (ver auditoria 23/08/2026). A Secao 4 a substitui e apaga.
# Para rodar mesmo assim: pytest app/tests
testpaths = tests
