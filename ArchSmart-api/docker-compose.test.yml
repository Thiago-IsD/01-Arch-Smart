services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arqsmart
      POSTGRES_PASSWORD: arqsmart
      POSTGRES_DB: arqsmart_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arqsmart -d arqsmart_test"]
      interval: 2s
      timeout: 3s
      retries: 20
