name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]

# Um PR que recebe varios pushes seguidos cancela a execucao anterior: o unico
# resultado que interessa e o do ultimo commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — testes contra Postgres real
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: arqsmart
          POSTGRES_PASSWORD: arqsmart
          POSTGRES_DB: arqsmart_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U arqsmart -d arqsmart_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # A suite se recusa a rodar contra banco que nao termine em _test (ver
      # tests/conftest.py). As chaves abaixo sao obrigatorias em
      # app/core/config.py e precisam existir, mas nenhum teste as usa de
      # verdade — nao ha segredo de producao no CI.
      TEST_DATABASE_URL: postgresql://arqsmart:arqsmart@localhost:55432/arqsmart_test
      SUPABASE_URL: https://ci.invalido.supabase.co
      SUPABASE_KEY: chave-de-ci-sem-valor
      SUPABASE_SERVICE_ROLE_KEY: chave-de-ci-sem-valor
      GEMINI_API_KEY: chave-de-ci-sem-valor
    defaults:
      run:
        working-directory: ArchSmart-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Testes (inclui a receita de migracoes em banco vazio)
        run: pytest -q

  frontend:
    name: Frontend — tipos, testes e catraca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ArchSmart-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        working-directory: ArchSmart-web
        run: npm ci
      - name: Tipos
        working-directory: ArchSmart-web
        run: npm run typecheck
      - name: Testes
        working-directory: ArchSmart-web
        run: npm test
      - name: Medir o lint
        # O eslint sai !=0 quando ha erro (o numero atual esta no `eslint_erros`
        # de tools/catraca.json). Quem decide se isso reprova o PR e a
        # catraca, comparando com o baseline versionado.
        working-directory: ArchSmart-web
        run: npx eslint . --format json -o eslint.json || true
      - name: Catraca — lint, cores literais e doc de modulo
        run: python tools/catraca.py --eslint-json ArchSmart-web/eslint.json

  e2e:
    name: E2E — Playwright contra staging
    runs-on: ubuntu-latest
    # Sem `needs: frontend` de proposito. Encadear economizaria minutos de
    # Chromium quando o frontend ja esta vermelho, mas deixaria este check
    # SKIPPED nesse caso — e um check cinza no PR e lido como "nao ha nada
    # aqui", nao como "nao mediu". Branch protection nao esta ligada (ver
    # CLAUDE.md, "Portoes de CI"), entao quem le os checks e uma pessoa, e
    # cada job tem de dar o veredito dele por conta propria.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ArchSmart-web/package-lock.json
      - name: Instalar dependencias
        working-directory: ArchSmart-web
        run: npm ci
      - name: Instalar o Chromium do Playwright
        working-directory: ArchSmart-web
        run: npx playwright install --with-deps chromium
      - name: Rodar os specs de guarda
        working-directory: ArchSmart-web
        env:
          # `playwright.config.ts` sobe o proprio servidor (`npm run dev` em
          # localhost:3000), e `src/lib/env.ts` valida as tres variaveis
          # abaixo com Zod na primeira pagina carregada — sem elas nenhuma
          # rota renderiza, nem a de login. Elas NAO estao no repositorio
          # (Art. 4): as duas URLs sao de ambiente e vao em Variables, a
          # chave anon e o par de credenciais vao em Secrets.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        # O cold start do Render ja foi medido em 41,9 s (ADR 0009) e em 41,4 s
        # em 08/09/2026. Este `timeout-minutes` e do passo inteiro; quem
        # tropeca primeiro no cold start sao os timeouts POR TESTE do
        # Playwright (30 s de teste e 30 s de `waitForSelector`, por padrao) —
        # por isso `playwright.config.ts` os levanta quando `CI` esta ligado.
        # Os dois precisam cobrir o cold start, senao o primeiro PR da manha
        # reprova por um motivo que nao e defeito de codigo.
        timeout-minutes: 15
        # Os specs vao POR NOME, e nao `npx playwright test` sem filtro.
        # `e2e/` tem dois INSTRUMENTOS, que nao sao guarda e nao podem virar
        # portao: `medicao-biblioteca.spec.ts` produz uma mediana (um numero
        # de medicao nao tem verde nem vermelho) e `captura-visual-secao-6.spec.ts`
        # exige `CAPTURAS_DIR` no ambiente e escreve imagem fora do
        # repositorio. Rodar sem filtro reprovaria por falta de variavel, e a
        # saida barata para isso seria um `skip` silencioso — que este
        # repositorio nao admite. Spec novo de guarda entra nesta linha; nao
        # basta criar o arquivo.
        run: >-
          npx playwright test
          e2e/auth.spec.ts
          e2e/dashboard.spec.ts
          e2e/hidratacao-biblioteca.spec.ts
          e2e/telemetria-biblioteca.spec.ts
          --reporter=line

  repo:
    name: Repositorio — progresso, links e sincronia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O diff de tres pontos (`git diff origin/develop...origin/main`)
          # precisa do merge-base entre as duas branches; sem o historico
          # completo o merge-base nao e calculavel e o diff de tres pontos
          # quebra. O checkout raso padrao traz so o ultimo commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes dos scripts de tools/
        working-directory: tools
        run: python -m unittest discover -p "test_*.py" -v
      - name: PROGRESS.md bate com as caixas marcadas
        run: python tools/progresso.py --check
      - name: Links internos da documentacao
        run: python tools/checa_links.py
      - name: O baseline da catraca nao afrouxou
        # A recusa do `--atualizar` guarda a FERRAMENTA; este passo guarda o
        # ARQUIVO. Quem tem o PR travado pela catraca pode abrir
        # tools/catraca.json e subir o numero na mao: a catraca passa a dizer
        # "baixou de 9999 para 521" e sai 0, sem que a pessoa precise sequer
        # saber que --aceitar-piora existe. So a comparacao com a branch base
        # enxerga isso, porque ela compara baseline com baseline, e nao com o
        # medido. Descoberto por auditoria adversarial da propria Secao 3.
        run: |
          BASE="${{ github.base_ref || 'develop' }}"
          git fetch origin "$BASE" --quiet
          if git show "origin/$BASE:tools/catraca.json" > /tmp/catraca_base.json 2>/dev/null; then
            python tools/catraca.py --comparar-baseline-com /tmp/catraca_base.json
          else
            echo "origin/$BASE nao tem tools/catraca.json ainda; nada a comparar."
          fi
      - name: main nao tem mudanca ausente em develop
        # Hotfix aplicado em main precisa voltar para develop no mesmo dia
        # (ADR 0005). A comparacao e de CONTEUDO, nao de contagem de commits:
        # `git rev-list --count origin/develop..origin/main` acusa tambem os
        # merge commits que o fluxo antigo deixou em main — em 24/08/2026 sao
        # 9 commits que nao carregam nenhuma mudanca ausente em develop, ou
        # seja, um alarme falso permanente. O diff de tres pontos compara a
        # base de merge com main: so acusa quando main tem conteudo que
        # develop nao tem, que e exatamente o hotfix perdido do ADR 0005.
        # So volta ao verde com merge para develop, nunca com cherry-pick: e
        # o merge que avanca o merge-base entre as duas branches.
        run: |
          git fetch origin main develop --quiet
          if ! git diff --quiet origin/develop...origin/main; then
            echo "main tem mudanca de conteudo ausente em develop:"
            git diff --stat origin/develop...origin/main
            echo "commits candidatos:"
            git log --oneline origin/develop..origin/main
            echo "corrija com: git checkout develop && git merge origin/main -- cherry-pick nao zera este check, porque o merge-base nao avanca."
            exit 1
          fi
          echo "main nao tem mudanca ausente em develop."

# Portoes que ainda nao existem. Nao sao stub vazio de proposito: verificacao
# que nao mede nada da a impressao de uma cobertura que nao ha.
#
#   validador de contraste (4.5:1 nos dois temas) — Secao 6, junto com os
#     tokens --success/--warning que hoje faltam
#   teste GENERICO de isolamento entre contas — Secao 4, junto com o
#     ScopedRepository. Atencao: `ArchSmart-api/tests/isolation/` JA EXISTE e
#     roda em todo PR, dentro do `pytest -q` do job backend: 27 testes que
#     montam recurso na conta A, acessam autenticado como conta B e exigem 404.
#     Vieram da Secao 1. O que falta e o teste que percorre TODAS as rotas
#     registradas automaticamente, e esse depende do ScopedRepository.
